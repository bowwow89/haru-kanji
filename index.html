<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#18483f">
  <title>하루한자 · 한자 학습</title>
  <style>:root {

}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
button,input,a{font:inherit} button,a,input{touch-action:manipulation} button{cursor:pointer;color:inherit;border:0;background:transparent}
button{transition:background-color .15s,color .15s,border-color .15s} a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b46132;outline-offset:4px}
button:disabled{cursor:default;opacity:.48} h1,h2,h3,p{margin:0} h1:focus{outline:none} button svg,a svg,.icon{width:19px;height:19px;vertical-align:middle;flex:none}
svg{fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round} i[data-icon]{font-style:normal}
[hidden]{display:none!important} .shell{width:min(1160px,calc(100% - 72px));margin-inline:auto}
.top{background:var(--white);border-bottom:1px solid var(--line)}.top-inner{display:flex;align-items:center;gap:56px;min-height:74px}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:1.32rem;letter-spacing:-.075em;font-weight:850;white-space:nowrap;color:var(--green)}
.seal{display:grid;place-items:center;width:35px;height:35px;font:700 1.55rem/1 var(--jp);letter-spacing:0;color:#fff8eb;background:var(--green);border-radius:8px 7px 8px 3px;box-shadow:inset 0 0 0 3px var(--green),inset 0 0 0 4px #96b6a3;transform:rotate(-3deg)}
nav{display:flex;align-self:stretch;gap:25px}nav button{position:relative;display:flex;align-items:center;gap:8px;padding:0 4px;font-size:.94rem;color:var(--muted);font-weight:650}
nav button[aria-current="page"]{color:var(--green)}nav button[aria-current="page"]:after{content:"";position:absolute;height:3px;bottom:0;left:0;right:0;background:var(--green);border-radius:2px}
.sound,.quiet,.plain,.btn,.mark,.icon-btn,.keycap,.save{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.sound{margin-left:auto;font-size:.875rem;font-weight:650;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:30px}.sound:hover,.quiet:hover,.icon-btn:hover,.keycap:hover{background:var(--mint)}
main{padding:36px 0 58px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:23px}
.collection{display:flex;align-items:center;gap:9px;color:#576760;font-weight:650;font-size:.83rem;letter-spacing:.025em}
.red-line{height:2px;width:21px;background:var(--red)}h1{font-size:clamp(2rem,3vw,2.6rem);line-height:1.27;letter-spacing:-.075em;font-weight:830;margin-top:5px}
#quick-search,.search-wrap{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--muted);background:var(--white)}
#quick-search input,.search-wrap input{font-size:1rem;border:0;background:transparent;outline:none;min-width:0;width:100%;color:var(--ink)}
#quick-search{width:255px}.keycap{font:1rem var(--mono);border:1px solid var(--line);border-radius:4px;min-width:24px;height:23px}
#quick-search:focus-within,.search-wrap:focus-within{border-color:var(--green);box-shadow:0 0 0 2px #18483f22}
.layout{display:grid;grid-template-columns:minmax(0,2.23fr) minmax(260px,1fr);gap:22px;align-items:start}
.stack,.aside{display:grid;gap:18px;min-width:0}.panel{background:var(--white);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.card{border-color:#cad5ca}.card-face{background:var(--green);color:#fffaf0;position:relative;isolation:isolate;overflow:hidden;padding:20px 26px 27px}
.card-face:after{content:"";position:absolute;z-index:-1;bottom:-24px;right:-15px;width:180px;height:102px;opacity:.3;background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 6px,#6c9987 6.5px 7.5px,transparent 8px 12px) 0 0/56px 28px;mask-image:linear-gradient(135deg,transparent 20%,black)}
.card-top,.panel-title,.word-left,.word-right,.card-actions,.title-row,.stat-row,.review-meta{display:flex;align-items:center;gap:10px}
.card-top{justify-content:space-between}.card-label{display:flex;align-items:center;gap:12px;font-size:.88rem;color:#e0eae1;font-weight:700}.rule{width:1px;height:13px;background:#719083}
.serial{font:.8rem var(--mono);letter-spacing:.065em;color:#c5d6cb}.save{color:#f0f5e9;border:1px solid #6d9181;border-radius:8px;width:38px;height:36px}.save:hover,.save[aria-pressed="true"]{background:#386556}.save[aria-pressed="true"] svg{fill:currentColor}
.card-body{display:grid;grid-template-columns:minmax(130px,.92fr) minmax(0,1.6fr);align-items:center;gap:30px;padding:18px 6px 8px}
.copy-grid{width:100%;max-width:185px;aspect-ratio:1;margin:auto;position:relative;display:grid;place-items:center;border:1px solid #e0ead537}
.copy-grid:before,.copy-grid:after{content:"";position:absolute;pointer-events:none}.copy-grid:before{top:50%;left:0;right:0;border-top:1px dashed #e0ead53b}.copy-grid:after{left:50%;top:0;bottom:0;border-left:1px dashed #e0ead53b}
.glyph{font:500 clamp(6.5rem,10.3vw,9.3rem)/1 var(--jp);position:relative;z-index:1;color:#fff6e2;text-shadow:0 1px 1px #143830}
.card-info h2{font-size:clamp(1.8rem,3.1vw,2.75rem);letter-spacing:-.065em;line-height:1.18}.gloss{font-size:1.02rem;color:#d4e0d4;margin-top:6px}
.readings{border-top:1px solid #ffffff35;margin:16px 0 0;padding-top:11px;display:grid;gap:6px}.reading{display:flex;gap:10px;align-items:baseline}.reading dt{font-size:.79rem;color:#d3e4d9;flex:none;line-height:1.7;background:#ffffff13;border-radius:4px;padding:0 6px}
.reading dd{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}.say-reading{color:#fff9ee;padding:0;font-size:1.06rem;line-height:1.4}.say-reading:hover{text-decoration:underline}
.card-actions{justify-content:space-between;padding:13px 21px;background:var(--white)}.nav-pair{display:flex;align-items:center;gap:6px}
.quiet,.plain,.btn,.mark{min-height:39px;border-radius:7px;font-size:.94rem;font-weight:700}.quiet{padding:5px 8px;color:var(--muted)}
.btn,.mark{padding:8px 16px;color:white;background:var(--green)}.btn:hover,.mark:hover{background:#246254}.btn.secondary,.mark.done{background:var(--mint);color:var(--green)}.plain{border:1px solid var(--line);padding:7px 13px;background:var(--white)}.plain:hover{border-color:#99ab9c}
.box{padding:21px 23px}.panel-title{justify-content:space-between;margin-bottom:16px}.panel-title h2,.review-title,.results-head h2{font-size:1.16rem;letter-spacing:-.05em}.title-row{gap:8px}
.tinted{color:var(--green)}.sun{color:#b05c32}.sub,.panel-date{font-size:.85rem;color:var(--muted)}.goal strong{font-size:2.55rem;line-height:1.15;letter-spacing:-.08em;color:var(--green)}
.goal .total{color:var(--muted);font-size:1rem;margin-left:6px}.segments{display:flex;gap:4px;margin:12px 0 11px}.segments i{flex:1;height:7px;background:#e4e9df;border-radius:2px}.segments .filled{background:#4b7a64}
.stat-row,.next-label{font-size:.9rem;color:var(--muted)}.stat-row{justify-content:space-between}.stat-row strong{color:var(--ink);font-family:var(--mono)}
.next-block{border-top:1px solid var(--line);margin-top:17px;padding-top:14px}.next-label{display:block;margin-bottom:8px;font-weight:650}
.upcoming{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tile{border:1px solid var(--line);border-radius:7px;background:#f5f6ef;padding:5px;font:1.4rem var(--jp);height:40px}.tile:hover{background:var(--mint);border-color:#9daa9b}
.review-link{width:100%;text-align:left;background:#e5eddf;border-color:#cfdbca;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px}.review-link:hover{background:#dce7d8}.review-description{display:block;font-size:.86rem;color:#496150;margin-top:5px}
.cards-art{display:grid;place-items:center;position:relative;width:51px;height:50px;flex:none}.cards-art:before,.cards-art span{width:30px;height:37px;border:1px solid #849c83;border-radius:4px}.cards-art:before{content:"";position:absolute;transform:translate(-7px,-1px) rotate(-15deg);background:#c1d2b9}.cards-art span{position:relative;display:grid;place-items:center;font:1.21rem var(--jp);color:#537557;transform:rotate(9deg);background:#f2f5e9}
.words-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.word-count{font-size:.86rem;color:var(--muted);font-weight:500}.word-list{display:grid}.word-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);min-height:56px;padding:10px 0}.word-row{border:0}.word-list>div+div{border-top:1px solid var(--line)}.word-left{flex-wrap:wrap;gap:8px 14px}.word-text{font:1.37rem/1.4 var(--jp)}ruby rt{font:normal .73rem/1.15 var(--sans);color:var(--muted)}
.read-type{color:#586d5e;background:#eef2e9;font-size:.77rem;padding:1px 6px;border-radius:4px;font-weight:650}.word-right{color:#4f5c55;font-size:.94rem;text-align:right}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:#4b6252;flex:none}.icon-btn svg{width:15px;height:15px}
.more{font-size:.88rem;font-weight:700;color:var(--green);padding:7px;border-radius:6px}.more:hover{background:var(--mint)}
details.panel summary,.sentence summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}details[open]>summary .chev{transform:rotate(180deg)}
details.panel summary{font-weight:700;padding:15px 23px}details.panel .detail-content{padding:0 23px 18px}details h3{font-size:1rem;margin:10px 0 3px}.detail-content p{white-space:pre-line;color:var(--muted)}
.sentence{padding:9px 12px;background:#f3f5ee;border-radius:6px;margin:3px 0 8px}.sentence summary{font-size:.86rem;color:var(--muted)}.sentence p{margin-top:7px}.sentence small{display:block;font-size:.86rem;color:var(--muted)}
.search-wrap{max-width:680px;padding:12px 15px;margin-bottom:18px}.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.dict-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dict-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left}.dict-card:hover{background:#edf3e9;border-color:#9bad9e}
.dict-glyph{display:grid;place-items:center;width:48px;height:52px;flex:none;font:2rem var(--jp);border-radius:6px;color:var(--green);background:#eef2e8}.dict-card strong,.dict-card small{display:block}.dict-card strong{line-height:1.4}.dict-card small{font-size:.8rem;color:var(--muted);margin-top:3px}
.pager,.practice-actions{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0}.empty,.practice{padding:32px;text-align:center}.empty h2,.practice h2{margin:12px 0 6px;letter-spacing:-.04em}.empty p,.practice p{color:var(--muted)}.empty .btn,.practice>.btn{margin-top:16px}
.review-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.practice{max-width:660px;margin:0 auto}.practice .copy-grid{background:var(--green);border-radius:9px;width:138px;margin:19px auto}.practice .glyph{font-size:6.3rem}.practice-answer{margin-top:12px}.practice-answer [lang="ja"]{font-size:1.1rem}.quiz-prompt{margin-top:16px}.practice-actions{margin-bottom:0;flex-wrap:wrap}.review-meta{justify-content:space-between;color:var(--muted);font-size:.9rem}
.scope{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;background:#183a32;color:#fff;border-radius:8px;font-size:.92rem;padding:9px 16px;z-index:4;box-shadow:0 3px 12px #183a3222}.toast:empty{display:none}
@media(min-width:1250px){main{padding-top:43px}.card-body{padding-top:21px;padding-bottom:14px}.card-face{padding:23px 30px 29px}}
@media(max-width:940px){.shell{width:calc(100% - 40px)}.top-inner{gap:32px}.layout{gap:14px;grid-template-columns:minmax(0,1.85fr) minmax(225px,1fr)}.card-body{gap:17px;padding-inline:0;grid-template-columns:minmax(106px,.86fr) minmax(0,1.48fr)}.card-face{padding:16px 18px 20px}.box{padding:16px 18px}.dict-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card-actions{padding:10px}}
@media(max-width:700px){.shell{width:calc(100% - 32px)}.top-inner{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding-top:12px}.brand{font-size:1.18rem}.seal{width:31px;height:31px}.sound{grid-column:2;grid-row:1;padding:5px 9px}nav{grid-column:1/-1;grid-row:2;gap:0;margin-top:8px}nav button{flex:1;justify-content:center;padding:10px 0}.layout{grid-template-columns:minmax(0,1fr);gap:16px}.stack,.aside{gap:12px}.aside{grid-template-columns:1fr 1fr}.aside .next-block{display:none}.page-heading{margin-bottom:14px}main{padding-top:22px}#quick-search{width:195px}.dict-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card-body{max-width:510px;margin:auto;grid-template-columns:minmax(105px,.9fr) minmax(0,1.5fr);gap:20px;padding:14px 0 5px}.copy-grid{max-width:144px}.card-info h2{font-size:2rem}.glyph{font-size:clamp(5.5rem,18vw,7.6rem)}.readings{margin-top:11px;padding-top:8px}.page-heading h1{font-size:2rem}.review-link{flex-direction:column-reverse;align-items:flex-start;justify-content:center}.panel-date{font-size:.78rem}}
@media(max-width:480px){.shell{width:calc(100% - 26px)}#quick-search{display:none}.card-top .card-label{font-size:.82rem}.card-body{gap:15px;grid-template-columns:minmax(92px,.85fr) minmax(0,1.5fr)}.card-face{padding:14px 14px 18px}.gloss{font-size:.91rem}.reading{gap:7px}.reading dd{gap:3px 7px}.say-reading{font-size:1rem}.aside{grid-template-columns:1fr}.aside .next-block{display:block}.review-link{flex-direction:row;align-items:center;justify-content:space-between}.box{padding:16px}.word-right{font-size:.87rem}.word-left{gap:6px}.dict-card{padding:9px;gap:8px}.dict-glyph{width:36px;height:44px;font-size:1.65rem}.dict-card strong{font-size:.94rem}.empty,.practice{padding:22px 14px}.card-actions .mark{padding-inline:12px}.panel-title{margin-bottom:10px}.quiet{padding-inline:5px}.collection{font-size:.8rem}.review-meta{gap:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#pen-dialog{border:1px solid var(--line);border-radius:17px;background:var(--white);color:var(--ink);width:min(410px,calc(100% - 28px));padding:20px;max-height:92dvh;overflow:auto;box-shadow:0 14px 60px #142c2940}
#pen-dialog::backdrop{background:#152d27a8}
#pen-dialog .pen-head,#pen-dialog .pen-tools{display:flex;align-items:center;justify-content:space-between;gap:8px}
#pen-dialog h2{font-size:1.18rem;letter-spacing:-.045em}
.pen-launch{display:inline-flex;align-items:center;gap:7px;border:1px solid #8cae9e;background:#ffffff14;color:#fff9eb;border-radius:8px;padding:6px 12px;margin-top:13px;font-size:.92rem;font-weight:650}.pen-launch:hover{background:#ffffff2a}
.pen-board{width:min(100%,min(340px,49dvh));aspect-ratio:1;margin:12px auto;position:relative;background:#faf9f3;border:1px solid #d7dccc;border-radius:10px;overflow:hidden}
#pen-pad{display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:crosshair;stroke-linecap:round;stroke-linejoin:round}
.pen-cross{stroke:#d2d7c8;stroke-width:.45;stroke-dasharray:1.5 2}.pen-ghost{stroke:#dadfce;stroke-width:4.1}.pen-now{stroke:#9cb79c;stroke-width:4.1}.pen-ok{stroke:#205849;stroke-width:4.1}.pen-live{stroke:#325e50;stroke-width:3;fill:none}.pen-bad{stroke:#b84636;stroke-width:3.4;animation:pen-shake .38s ease-in-out both;transform-box:fill-box;transform-origin:center}.pen-start{stroke:#fff;stroke-width:.7;fill:#b25436}
#pen-feedback{min-height:2.9em;line-height:1.4;color:var(--muted);font-size:.91rem;margin:8px 0}#pen-feedback.bad{color:#a22e24}#pen-count{font:.86rem var(--sans);color:var(--green);font-weight:700}
.pen-tools button{min-height:38px}.pen-note{font-size:.75rem;color:#64756a;margin-top:10px}.pen-note a{text-decoration:underline}.pen-trace-glyph{font:88px var(--jp);fill:#daddce;stroke:none}.pen-ink{stroke:#25584b;stroke-width:3.3}
@keyframes pen-shake{0%,100%{transform:translateX(0)}25%,65%{transform:translateX(-1.65px)}45%,85%{transform:translateX(1.65px)}}
@media(prefers-reduced-motion:reduce){.pen-bad{animation:none}}


.level-picker{margin:0 0 18px}.level-top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}.level-top strong{font-size:.94rem}.level-top span,.level-foot{color:var(--muted);font-size:.82rem}.level-options{display:flex;gap:6px}.level-options button{border:1px solid var(--line);background:var(--white);color:var(--muted);font-weight:700;min-width:54px;min-height:44px;border-radius:8px;padding:6px 12px}.level-options button[aria-pressed="true"]{color:#fff;background:var(--green);border-color:var(--green)}.level-options button:hover:not([aria-pressed="true"]){background:var(--mint)}.level-tag{border:1px solid #83a496;border-radius:5px;color:#ecf6ed;font:600 .76rem var(--sans);padding:1px 6px}.level-foot{margin:24px 0 0;line-height:1.6}.level-foot a{text-decoration:underline;white-space:nowrap}
@media(max-width:700px){
 .shell{width:calc(100% - max(14px,env(safe-area-inset-left)) - max(14px,env(safe-area-inset-right)));max-width:680px}
 main{padding-bottom:max(32px,env(safe-area-inset-bottom))}.top-inner{padding-top:max(8px,env(safe-area-inset-top))}
 .page-heading{margin-bottom:14px}.level-options{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.level-options button{min-width:0;padding:4px 0}.level-tag{white-space:nowrap}
 .card-label{flex-wrap:wrap;gap:6px}.card-actions button,.save,.pen-launch,.pen-tools button,#pen-hint,#pen-close,.sound,.tile,.more,.dict-card,.icon-btn,nav button{min-height:44px}.save,.icon-btn{min-width:44px}.nav-pair{gap:4px}.card-actions .quiet{min-width:55px}
 .level-picker{margin-bottom:12px}.level-top{justify-content:space-between}.card-info{min-width:0}.reading dd{min-width:0}.word-row,.word-left,.word-right{min-width:0}.word-text{overflow-wrap:anywhere}.card-body{touch-action:pan-y pinch-zoom}
 #pen-dialog{width:min(100% - 16px,420px);padding:14px;max-height:calc(100dvh - max(16px,env(safe-area-inset-bottom)));overscroll-behavior:contain}.pen-board{width:min(100%,350px,53dvh)}
}
@media(max-height:510px) and (orientation:landscape){#pen-dialog{width:min(640px,97vw);max-height:96dvh;padding:9px 14px}#pen-dialog[open]{display:grid;grid-template-columns:min(45vw,72dvh) 1fr;column-gap:16px;align-content:center}.pen-board{grid-column:1;grid-row:1/7;width:100%;margin:0}#pen-dialog>:not(.pen-board){grid-column:2;align-self:center}#pen-dialog .pen-tools{flex-wrap:wrap}.pen-note{margin:2px}}

</style>
  
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <a href="#study" class="brand" data-tab="study"><span class="seal" lang="ja" aria-hidden="true">字</span>하루한자</a>
    <nav aria-label="주 메뉴">
      <button data-tab="study"><i data-icon="book"></i>한자 학습</button>
      <button data-tab="dictionary"><i data-icon="grid"></i>한자 사전</button>
      <button data-tab="review"><i data-icon="bookmark"></i>복습장</button>
    </nav>
    <button id="sound" class="sound" title="발음 재생 설정"></button>
  </div></header>
  <main class="shell">
    <div class="page-heading">
      <div><div class="collection"><span class="red-line"></span><span id="collection">일본어 상용한자</span></div>
      <h1 id="heading" tabindex="-1">한자 학습</h1></div>
      <form id="quick-search" role="search"><i data-icon="search"></i><input aria-label="한자 사전 검색" placeholder="한자, 뜻, 읽기 검색" type="search" autocomplete="off"><button class="keycap" aria-label="검색 실행">↵</button></form>

function parseMeaning(item) {

  const name=match[1].replace(/^([가-힣]),\s*(.+)$/u,(_,a,b)=>a+(b.includes(' ')?'':' ')+b);
  return {name,gloss:match[2].replace(/\s+,/g,',').replace(/[.]$/,'')};

  if(!total){mode='idle';message('이 기기에서 한자 모양을 불러오지 못했어요. 다시 쓰기를 눌러 주세요.');return;}
  trace={mask,covered:new Uint8Array(size*size),total,count:0};
  shape('image',{href:canvas.toDataURL(),x:0,y:0,width:size,height:size},el('model'));
  el('count').textContent='모양 따라 쓰기 · 0%';message('획순 자료를 열 수 없어 모양으로 연습해요. 회색 글자를 한 획씩 덮어 주세요.');
}
function traceStroke(points){
  const length=points.slice(1).reduce((v,p,i)=>v+Math.hypot(p[0]-points[i][0],p[1]-points[i][1]),0);
  if(length<2)return false;
  const sample=measureStroke(points,Math.min(480,Math.ceil(length)+1)).samples;
  const fresh=new Set(),snapped=[];
  let outside=0,run=0,longest=0;
  for(const [px,py] of sample){
    const x=Math.round(px),y=Math.round(py);let nearest=Infinity,chosen=null;
    for(let j=Math.max(0,y-6);j<=Math.min(108,y+6);j++)for(let i=Math.max(0,x-6);i<=Math.min(108,x+6);i++){
      const index=j*109+i,d=(px-i)**2+(py-j)**2;
      if(!trace.mask[index]||d>36)continue;
      if(d<nearest){nearest=d;chosen=[i,j];}
      if(d<25&&!trace.covered[index])fresh.add(index);
    }
    if(!chosen){outside++;run++;longest=Math.max(longest,run);}else{run=0;snapped.push(chosen);}
  }
  if(outside>sample.length*.17||longest>7||fresh.size<3)return false;
  for(const i of fresh)trace.covered[i]=1;
  trace.count+=fresh.size;
  path(line(snapped),'pen-ink',el('saved'));
  const ratio=trace.count/trace.total;
  if(ratio>=.91){mode='done';el('count').textContent='따라 쓰기 완성';message(character+' 완성!');}
  else{el('count').textContent='모양 따라 쓰기 · '+Math.round(ratio*100)+'%';message('좋아요. 남은 회색 부분을 이어서 써 보세요.');}
  return true;
}
function resetInput(){
  if(pointer!==null&&pad.hasPointerCapture(pointer))pad.releasePointerCapture(pointer);
  pointer=null;ink=[];el('overlay').replaceChildren();
}
async function start(ch){
  const token=++attempt;
  request?.abort();resetInput();hintAnimation?.cancel();
  character=ch;steps=[];at=0;trace=null;reference=null;mode='loading';
  for(const id of ['model','saved','guide'])el(id).replaceChildren();
  el('heading').textContent=ch+' · 손글씨 연습';el('credit').hidden=true;el('hint').hidden=true;
  el('count').textContent='획순 불러오는 중';message('');
  if(basic[ch]){beginStrokes(basic[ch],false);return;}
  request=new AbortController();const localRequest=request;
  const timeout=setTimeout(()=>localRequest.abort(),2800);
  try{const data=await getPaths(ch,localRequest.signal);if(attempt===token)beginStrokes(data,true);}
  catch{if(attempt===token)beginTracing();}
  finally{clearTimeout(timeout);}
}
function show(ch,button){
  if(!ch)return;
  owner=button;dialog.showModal();start(ch);
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-write]');
  if(btn&&!dialog.open)show(btn.dataset.write,btn);
});
dialog.addEventListener('close',()=>{attempt++;request?.abort();resetInput();hintAnimation?.cancel();if(owner?.isConnected)owner.focus({preventScroll:true});});
el('close').onclick=el('finish').onclick=()=>dialog.close();
el('reset').onclick=()=>start(character);
el('hint').onclick=()=>{
  if(mode!=='strokes')return;
  const group=el('guide');hintAnimation?.cancel();group.querySelector('.pen-demo')?.remove();
  const demo=path(steps[at],'pen-demo',group);demo.style.stroke='#477b59';demo.style.strokeWidth='3';
  const length=demo.getTotalLength();demo.style.strokeDasharray=String(length);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
    hintAnimation=demo.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:850});
    hintAnimation.onfinish=()=>demo.remove();
  }else{setTimeout(()=>demo.remove(),600);}
};
function coords(e){const p=pad.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const pt=p.matrixTransform(pad.getScreenCTM().inverse());return [pt.x,pt.y];}
function line(points){return points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ');}
function addPoint(e){const p=coords(e),prev=ink[ink.length-1];if(!prev||Math.hypot(prev[0]-p[0],prev[1]-p[1])>.4)ink.push(p);}
pad.addEventListener('pointerdown',e=>{
  if(!['strokes','trace'].includes(mode)||pointer!==null||!e.isPrimary||e.button!==0)return;
  e.preventDefault();pointer=e.pointerId;pad.setPointerCapture(pointer);ink=[coords(e)];
  el('overlay').replaceChildren();path(line(ink),'pen-live',el('overlay'));
});
pad.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointer)return;
  const group=e.getCoalescedEvents?.()||[];
  for(const sample of group)addPoint(sample);
  addPoint(e);el('overlay').firstChild.setAttribute('d',line(ink));
});
pad.addEventListener('pointerup',e=>{
  if(e.pointerId!==pointer)return;
  addPoint(e);const drawn=ink.slice();resetInput();
  if(mode==='strokes'&&strokeFits(drawn,reference)){path(steps[at],'pen-ok',el('saved'));at++;guide();return;}
  if(mode==='trace'&&traceStroke(drawn))return;
  const bad=drawn.length>1?path(line(drawn),'pen-bad',el('overlay')):shape('circle',{cx:drawn[0][0],cy:drawn[0][1],r:1.1,class:'pen-bad'},el('overlay'));
  setTimeout(()=>bad.remove(),460);message(mode==='strokes'?'시작점과 방향을 확인하고 이 획만 다시 써 보세요.':'회색 선을 따라 이 획만 다시 써 보세요.',true);
});
for(const type of ['pointercancel','lostpointercapture'])pad.addEventListener(type,e=>{if(pointer===e.pointerId)resetInput();});
})();</script>
